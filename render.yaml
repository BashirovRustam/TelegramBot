services:
  # Web Service для Telegram бота (Webhook режим)
  - type: web
    name: telegram-bot
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # Токен от BotFather, проверяй, чтобы не было пробелов
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-bot-db
          property: connectionString
      - key: TWOGIS_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: UPSTASH_REDIS_URL
        sync: false   # Redis URL от Upstash

databases:
  # PostgreSQL база данных
  - name: telegram-bot-db
    region: oregon
    plan: free
    databaseName: telegram_bot_db
    user: telegram_bot_user
